name: Lua checks
on: [push, pull_request]
jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ['5.2', '5.3']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}
      - run: python3 tools/package.py --check
      - run: lua${{ matrix.lua }} tools/check_syntax.lua
      - run: lua${{ matrix.lua }} run_tests.lua --no-color
  pki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-tools.txt
      - run: sudo apt-get update && sudo apt-get install -y liblua5.2-0
      - run: python -m unittest discover -s tools/tests -p '*_test.py'
